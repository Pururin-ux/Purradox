name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: physicslab_ci
      CORS_ORIGINS: http://127.0.0.1:4184
      REACT_APP_BACKEND_URL: http://127.0.0.1:4183
      PYTHONPATH: source/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        # The API does not import the Emergent SDK, which needs a separate package index.
        run: python -m pip install -c source/backend/requirements.txt fastapi uvicorn motor python-dotenv pytest pytest-xdist requests
      - name: Content audit
        run: python scripts/full-site/validate_course.py
      - name: Start API
        run: |
          python -m uvicorn server:app --app-dir source/backend --host 127.0.0.1 --port 4183 &
          echo $! > "$RUNNER_TEMP/physicslab-api.pid"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4183/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4183/api/health
      - name: API tests
        run: python -m pytest source/backend/tests
      - name: HTTP contract
        run: python scripts/full-site/http_release.py --base-url "$REACT_APP_BACKEND_URL" --output-prefix "$RUNNER_TEMP/http-release"
      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/physicslab-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/physicslab-api.pid")" 2>/dev/null || true
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: source/frontend
      - run: yarn test --watchAll=false
        working-directory: source/frontend
        env:
          CI: true
      - name: Curriculum math and markup
        run: node scripts/full-site/validate_math.cjs
      - name: Draft, progress and lesson regressions
        run: >-
          node --test checks/draft-migration.cjs checks/profile-transfer.cjs checks/reward-boundaries.cjs
          checks/learning-load.cjs checks/learning-drafts.cjs checks/lesson-redesign.cjs checks/review-redesign.cjs
          checks/ct-resume.cjs checks/ct-completion-save.cjs checks/ct-result-independent-review.cjs checks/ct-submission.cjs
          checks/study-motion.cjs checks/full-site.cjs checks/progress-regressions.cjs checks/quest-availability.cjs checks/quest-catalog-ui.cjs
      - run: yarn build
        working-directory: source/frontend
        env:
          CI: true
      - name: Guard the production bundle
        shell: bash
        run: |
          build=source/frontend/build
          test -s "$build/index.html"
          test -d "$build/static/js"
          test -z "$(find "$build" \( -name '*style-lab*' -o -name 'duo-v1.png' -o -name 'reactions-study-v1.png' \) -print -quit)"
          status=0
          grep -rliE --include='*.js' --include='*.html' --include='*.css' \
            'cute-style|/style-lab|CuteTrainer|posthog|assets\.emergent\.sh|__emergent_overlay__|visual-edit-overlay|undefined/api' "$build" || status=$?
          test "$status" -eq 1
